<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduTrack — Iniciar sesión</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark">🍎</div>
      <div>
        <div class="brand-name" style="color:var(--ink)">EduTrack</div>
        <div class="brand-tag" style="color:var(--ink-faint)">Monitoreo ODS 4</div>
      </div>
    </div>
    <h1 class="login-title">Bienvenido de nuevo</h1>
    <p class="login-sub">Correo institucional y contraseña para continuar.</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Correo institucional</label>
        <input type="email" id="email" placeholder="nombre@edutrack.edu.co" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <p class="error-text" id="loginError">Correo o contraseña incorrectos.</p>
      <div style="margin-top: 16px;">
        <button type="submit" class="btn primary block" id="btnLogin">Ingresar</button>
      </div>
    </form>
    <p class="login-hint">Pruebas: coordinador@edutrack.edu.co (admin) o docente@edutrack.edu.co / demo1234</p>
    <div style="margin-top: 14px;">
      <button type="button" class="btn ghost block" id="btnShowRegister">Crear cuenta de docente</button>
    </div>
  </div>

  <div class="login-card" id="registerCard" style="display:none;">
    <h1 class="login-title">Crear cuenta</h1>
    <p class="login-sub">Las cuentas nuevas se crean con rol docente.</p>
    <form id="registerForm">
      <div class="field">
        <label for="rgNombre">Nombre completo</label>
        <input type="text" id="rgNombre" placeholder="Nombre y apellido" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="rgEmail">Correo institucional</label>
        <input type="email" id="rgEmail" placeholder="nombre@edutrack.edu.co" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="rgPassword">Contraseña (mínimo 8 caracteres)</label>
        <input type="password" id="rgPassword" placeholder="••••••••" autocomplete="new-password" required>
      </div>
      <p class="error-text" id="registerError"></p>
      <div style="margin-top: 16px;">
        <button type="submit" class="btn primary block" id="btnRegister">Crear cuenta</button>
      </div>
    </form>
    <div style="margin-top: 14px;">
      <button type="button" class="btn ghost block" id="btnShowLogin">Ya tengo cuenta</button>
    </div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/services/authService.js"></script>
<script>
  // Si ya hay sesion activa, no mostrar el login de nuevo.
  if (authService.getSession()) {
    window.location.href = 'dashboard.html';
  }

  const form = document.getElementById('loginForm');
  const errorEl = document.getElementById('loginError');
  const btn = document.getElementById('btnLogin');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    errorEl.classList.remove('show');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) {
      errorEl.textContent = 'Ingresa tu correo y contraseña.';
      errorEl.classList.add('show');
      return;
    }
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Ingresando...';
    try {
      await authService.login(email, password);
      window.location.href = 'dashboard.html';
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Ingresar';
    }
  });

  // --- Registro de cuenta (docente) ---
  const loginCard = document.querySelector('.login-card');
  const registerCard = document.getElementById('registerCard');
  document.getElementById('btnShowRegister').addEventListener('click', function () {
    loginCard.style.display = 'none';
    registerCard.style.display = 'block';
  });
  document.getElementById('btnShowLogin').addEventListener('click', function () {
    registerCard.style.display = 'none';
    loginCard.style.display = 'block';
  });

  document.getElementById('registerForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const regErr = document.getElementById('registerError');
    const regBtn = document.getElementById('btnRegister');
    regErr.classList.remove('show');
    regBtn.disabled = true;
    regBtn.innerHTML = '<span class="spinner"></span>Creando...';
    try {
      await authService.register(
        document.getElementById('rgNombre').value.trim(),
        document.getElementById('rgEmail').value.trim(),
        document.getElementById('rgPassword').value
      );
      window.location.href = 'dashboard.html';
    } catch (err) {
      regErr.textContent = err.message;
      regErr.classList.add('show');
      regBtn.disabled = false;
      regBtn.textContent = 'Crear cuenta';
    }
  });
</script>
</body>
</html>
